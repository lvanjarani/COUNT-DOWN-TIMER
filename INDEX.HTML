<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="timer-app">
    <section class="timer-card">
      <p class="eyebrow">Time Keeper</p>
      <h1>Countdown Timer</h1>
      <p class="subtitle">Choose a future date and watch the remaining time update live.</p>

      <form class="timer-form" id="timer-form">
        <label for="target-date">Target Date & Time</label>
        <input type="datetime-local" id="target-date" name="target-date" required>

        <div class="button-row">
          <button type="submit" id="start-btn" disabled>Start Countdown</button>
          <button type="button" id="reset-btn" class="secondary">Reset</button>
        </div>
      </form>

      <div class="countdown-grid" aria-live="polite">
        <article class="time-box">
          <span id="days">00</span>
          <p>Days</p>
        </article>
        <article class="time-box">
          <span id="hours">00</span>
          <p>Hours</p>
        </article>
        <article class="time-box">
          <span id="minutes">00</span>
          <p>Minutes</p>
        </article>
        <article class="time-box">
          <span id="seconds">00</span>
          <p>Seconds</p>
        </article>
      </div>

      <p class="status" id="status-message">Set a date to begin the countdown.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
